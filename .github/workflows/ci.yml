name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.8"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q
      # PRD §8. Advisory: a new advisory against a pinned dependency should
      # show up in the run without turning every unrelated PR red.
      - run: uvx pip-audit
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The suite drives the real app against the fixture replayer, so it needs
      # both sides installed and a token pair for the fixture reset.
      - run: uv sync
        working-directory: api
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: |
          cat > .env <<'ENVEOF'
          READER_PROVIDER=fake
          ACCESS_TOKEN=ci-access
          ADMIN_TOKEN=ci-admin
          VITE_ACCESS_TOKEN=ci-access
          VITE_ADMIN_TOKEN=ci-admin
          DATA_DIR=../data-e2e
          PUBLIC_BASE_PATH=
          ENVEOF
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
