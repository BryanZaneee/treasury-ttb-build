# M0 exit criterion: `docker compose up` serves an empty inbox from the real
# API under /ttb-build (PRD §10). Data volume and reader wiring land in M1/M3.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        PUBLIC_BASE_PATH: ${PUBLIC_BASE_PATH:-}
    depends_on:
      - api
    volumes:
      - ../data:/srv/labelverify/data:ro
    ports:
      - "8080:8080"
